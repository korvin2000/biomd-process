# biomd-process — main configuration
# Full docs: biomd.config.yaml.example. Defaults: src/config/schema.ts.
# Env secrets: ${VAR} / ${VAR:-fallback}. Validate with `biomd config check`.

version: 1

project:
  name: biomd-process
  rootDir: .

input:
  baseDir: input
  include:
    - '*/**.bio.md'
  exclude:
    - '**/node_modules/**'
  sourceLanguage: auto # source language from first directory under baseDir
  slugSuffix: .bio.md
  limit: 0 # 0 = unlimited

# Optional roster hints; fill gaps only. Empty `file` disables.
roster:
  file: data/names.json
  language: ru # variant spellings; indexed only for roster language
  fillMetadata: true # fill missing forename/surname
  aliases: true # add roster spellings/order as aliases
  nameHints: true # use roster spellings for portrait matching
  reportConflicts: false # report roster/article name conflicts

output:
  baseDir: out
  channels:
    metadata: '{lang}/{slug}.bio.json'
    translation: '{lang}/{slug}.bio.md'
    catalogIndex: 'index.json'
    catalogLocalizedIndex: 'index-{lang}.json'
    # Internal hint files; dot-prefixed to stay unpublished.
    catalogHints: '.hints/{slug}.json'
    portraitHints: '.hints/{slug}.portrait.json' # portrait choice + alternatives
    websearchHints: '.hints/{slug}.web.json'
  # skip | overwrite | fail. `skip` also blocks --no-skip-existing reruns;
  # use overwrite when CLI-forced regeneration must remain possible.
  onExisting: skip
  jsonIndent: 2

# Published-format settings shared by extract/search/localize/catalog/validate.
catalogue:
  supportedLanguages: [en, es, ja, de, fr, it, pt, ru, zh, ko] # VD-LANG; Chinese = `zh`
  # day | month | year; coarsest published date precision.
  datePrecision: year
  defaultType: guitarist # fallback biography type
  defaultPageType: hidden # routable but hidden from the grid
  allowUnknownTypes: false # reject unrecognized machine types

# Pipeline stages can be enabled independently.
tasks:
  extract:
    enabled: true
    pool: extract
    outputChannel: metadata
    # Minimum dossier fields; collectives waive person-only requirements.
    requiredFields: [forename, surname]
    # Read the full source; skip truncated extraction rungs.
    readWholeDocument: true
    # Authored sibling dossier: reuse | complete | rebuild.
    onExistingDossier: reuse
    # Parse article image containers/tables into gallery metadata.
    harvest:
      photos: true
      music: true
      maxItems: 60
    emitCatalogHints: true # emit type/gender/country/title hints
    fields: [] # [] = built-in extraction card

  # Fill missing dossier facts; no gaps means no search call.
  websearch:
    enabled: true
    pool: websearch
    outputChannel: metadata # complete dossier in place
    hintsChannel: websearchHints
    fields: [born, died, birthplace, deathplace, country]
    # Route only to targets declaring real web-search capability.
    requireWebSearchCapability: true
    requireSource: true # require a source URL
    minConfidence: 0.7
    # Age threshold for querying alive/dead/unknown when death is missing.
    livenessAgeYears: 78
    upgradePrecision: true # exact-date upgrades require corroboration/review
    # prefer-precise | report | ignore; equal-precision conflicts are reported.
    onDateConflict: prefer-precise
    includeContext: lead # none | lead
    contextChars: 600
    recordSources: url # fill empty metadata.url from best source

  translate:
    enabled: true
    pool: translate
    outputChannel: translation
    targetLanguages: [en, fr, es, de, it]
    skipSourceLanguage: true
    # Also emit the source-language article into the output tree.
    copySourceArticle: true
    verifyStructure: strict # strict structure check
    # segments = prose-only + local structure splice; document = whole Markdown.
    mode: segments
    # keep | translate; mixed fragments are always translated.
    foreignFragments: keep
    # auto | code | text; `auto` translates prose/verse fences.
    fencedBlocks: auto
    contextChars: 300 # title + lead context per batch
    # Batch-size guard; oversized batches are split and retried.
    maxSegmentsPerCall: 45
    repairAttempts: 2 # retry missing keys only; 0 = all-or-nothing
    # off | run | persistent; persistent uses run.memoryDir.
    useTranslationMemory: run

  # Localize prose fields only; structured fields are copied unchanged.
  localize:
    enabled: true
    pool: translate
    outputChannel: metadata
    targetLanguages: [en, fr, es, de, it] # [] = follow translate targets
    maxStringsPerCall: 60
    repairAttempts: 2
    useTranslationMemory: run

  # LLM-free portrait selection from names, image metadata, and article images.
  portrait:
    enabled: true
    indexFile: images/artists.json
    # Image root under the catalogue root; bucket-relative.
    assetPrefix: 'pages/'
    outputChannel: portraitHints
    # Minimum identity score; below it no image is emitted.
    minIdentity: 0.9
    maxTier: 2 # 1 = strict single-person; 2 allows weaker face evidence
    minPixels: 80
    excludeReleaseCovers: true # avoid release-cover false positives
    keepCandidates: 8
    onLowConfidence: omit # omit | default

  # Final LLM-free catalogue aggregation.
  catalog:
    enabled: true
    indexChannel: catalogIndex
    localizedIndexChannel: catalogLocalizedIndex
    localizedNames: true
    generateAliases: true
    # distinct trims search-redundant aliases; spec follows external/04 §4.5.
    aliasPolicy: distinct
    # Display-name order: roster | surname-first | given-first.
    # The alternate order remains searchable as an alias.
    displayNameOrder: roster
    # Fields allowed to overwrite merged values; [] = fill-only.
    refresh: []
    # merge=true preserves untouched rows/IDs; false rebuilds the index.
    merge: true

llm:
  endpoints:
    - id: local # OpenAI-compatible local gateway
      baseUrl: http://192.168.1.26:8080/v1
      maxConcurrent: 1
      requestsPerMinute: 0

    - id: omniroute
      baseUrl: http://192.168.1.26:20129/v1
      apiKey: ${OMNIROUTE_API_KEY}
      requestsPerMinute: 60
      # OmniRoute buffered overlap can cross-talk; stream=true is required for maxConcurrent > 1.
      maxConcurrent: 3
      minRequestSpacingMs: 350 # enforce inter-request spacing
      stream: true
      usage:
        # OmniRoute's Chat adapter adds cached tokens to prompt_tokens a second time.
        chatCachedTokens: additional

    - id: openrouter
      baseUrl: https://openrouter.ai/api/v1
      apiKey: ${OPENROUTER_API_KEY}
      headers:
        HTTP-Referer: https://www.abc-guitars.com
        X-Title: biomd-process
      requestsPerMinute: 90
      minRequestSpacingMs: 300
      maxConcurrent: 4

  models:
    - id: gemma-local
      endpoint: local
      model: gemma4-31b-local
      contextWindow: 65536
      maxOutputTokens: 16384
      capabilities: [json_schema, json_object, prompt_cache]
      pricing: { inputPer1M: 0, outputPer1M: 0 }
      params:
        temperature: 0.75
        topP: 0.915
        extra: { top_k: 64, min_p: 0.035 } # topK/minP are also first-class fields
      tags: [local, cheap]

    - id: gpt-luna
      endpoint: omniroute
      model: cx/gpt-5.6-luna
      # Gateway advertises 272k context / 128k output; cap output at 32k.
      contextWindow: 272000
      maxOutputTokens: 32768
      capabilities: [json_object, json_schema, prompt_cache, tools] # probe-verified
      pricing: { inputPer1M: 0, outputPer1M: 0 }
      # Disable default reasoning to avoid token/latency overhead.
      reasoning: { enabled: false, dialect: reasoning_effort }
      # Temperature omitted: this gateway ignores it.
      tags: [remote, cheap]

    - id: minimax-m3
      endpoint: openrouter
      model: minimax/minimax-m3
      contextWindow: 262144
      maxOutputTokens: 32768
      capabilities: [json_schema, json_object, prompt_cache]
      pricing: { inputPer1M: 0.30, outputPer1M: 1.20, cachedInputPer1M: 0.06 }
      reasoning: { enabled: false, dialect: reasoning }
      params:
        temperature: 0.36
      # Provider pin; allowFallbacks=false fails instead of routing elsewhere.
      # I am not sure, what is a correct way to configure provider?
        # Provider pin; allow_fallbacks=false fails instead of routing elsewhere.
        extra:
          provider:
            order: [CoreWeave, Parasail, DeepInfra]
            allow_fallbacks: false        
      provider: # or this way?
        order: [CoreWeave, Parasail, DeepInfra]
        allowFallbacks: false        
      tags: [remote, cheap]

    - id: deepseek
      endpoint: openrouter
      model: deepseek/deepseek-v4-flash-0731
      contextWindow: 128000
      maxOutputTokens: 16384
      capabilities: [json_schema, json_object, tools, prompt_cache]
      # Pricing reflects the provider order below.
      pricing: { inputPer1M: 0.08, outputPer1M: 0.18, cachedInputPer1M: 0.016 }
      # requireParameters rejects providers that silently ignore requested parameters.
      provider:
        order: [ambient/fp4, together, phala, deepinfra/fp8, morph/bf16]
        requireParameters: true
      # Disable upstream-default reasoning; hiding the trace alone does not disable it.
      reasoning: { enabled: false, dialect: reasoning }
      params:
        temperature: 0.6
        topP: 0.95
        topK: 42
        minP: 0.02
      tags: [remote, cheap]

    # Search routing relies on declared `web_search`; these use Responses with a required tool.
    # The configured gateways reject web search combined with JSON mode, so omit `json_object`.
    - id: search-std
      endpoint: omniroute
      model: cx/gpt-5.6-luna
      apiFormat: responses
      webSearchMode: responses_tool
      contextWindow: 272000
      maxOutputTokens: 32768
      capabilities: [tools, web_search]
      pricing: { inputPer1M: 0, outputPer1M: 0 }
      reasoning: { enabled: false, dialect: reasoning_effort }
      tags: [remote, search, cheap]

    - id: search-mx
      endpoint: omniroute
      model: cx/gpt-5.6-luna
      apiFormat: responses
      webSearchMode: responses_tool
      contextWindow: 272000
      maxOutputTokens: 32768
      capabilities: [tools, web_search]
      pricing: { inputPer1M: 0, outputPer1M: 0 }
      reasoning: { enabled: true, effort: medium, dialect: reasoning_effort }
      tags: [remote, search, cheap]

    - id: search-safe
      endpoint: omniroute
      model: cx/gpt-5.6-terra
      apiFormat: responses
      webSearchMode: responses_tool
      contextWindow: 272000
      maxOutputTokens: 32768
      capabilities: [tools, web_search]
      pricing: { inputPer1M: 0, outputPer1M: 0 }
      reasoning: { enabled: true, effort: low, dialect: reasoning_effort }
      tags: [remote, search, cheap]

    # `:online` enables provider web search and adds a per-request search fee.
    - id: paid-search
      endpoint: openrouter
      model: openai/gpt-5.6-luna:online
      webSearchMode: online
      contextWindow: 127000
      maxOutputTokens: 4096
      # No json_object: OpenAI web search is incompatible with JSON mode here.
      capabilities: [tools, web_search]
      pricing: { inputPer1M: 0.1, outputPer1M: 0.6, cachedInputPer1M: 0.075 }
      params:
        temperature: 0.1
      tags: [remote, search]

  routing:
    # cost-optimized | least-busy | context-optimized | sequential |
    # round-robin | least-failures.
    strategy: cost-optimized
    # A pool is also its fallback chain; object form adds per-pool options.
    pools:
      default:
        models: [gemma-local, gpt-luna, deepseek]
        strategy: round-robin

      # least-busy spreads extraction across endpoint capacity.
      extract:
        models: [gemma-local, gpt-luna, deepseek]
        strategy: least-busy

      # least-busy maximizes translation throughput across endpoints.
      translate:
        models: [gemma-local, gpt-luna, deepseek, minimax-m3]
        strategy: least-busy
        maxConcurrent:
          local: 1
          omniroute: 3
          openrouter: 4
        # Language preferences reorder candidates; they never remove fallbacks.
        # Preferences outrank the normal pool ranking.
        prefer:
          zh: [deepseek]
          ja: [deepseek]
          ko: [deepseek]
          it: [deepseek]
          es: [minimax-m3]
          fr: [deepseek, minimax-m3]
          de: [gpt-luna]
          en: [gpt-luna]
      # Free OmniRoute search targets first; paid-search is the final fallback.
      # maxTargets must stay >= 4; least-busy may use paid search for throughput.
      websearch:
        models: [search-mx, search-std, search-safe, paid-search]
        strategy: cost-optimized
    # demote | skip on overflow; `skip` avoids known-truncated calls.
    onOverflow: skip
    options: {}

  defaults:
    timeoutMs: 120000

# retry = same model; fallback = next model in the pool.
reliability:
  retry:
    maxAttempts: 3
    initialDelayMs: 500
    maxDelayMs: 20000
    factor: 2
    jitter: full
    respectRetryAfter: true
  fallback:
    maxTargets: 4
    onValidationFailure: true
  # Task-level fallback retries a broken whole task on another model.
  taskFallback:
    maxAttempts: 3 # 1 = disabled
    # After all targets fail, retry the least-failing target conservatively.
    lastAttempt:
      strategy: least-failures
      temperature: 0.1
  circuitBreaker:
    enabled: true
    failureThreshold: 5
    resetAfterMs: 30000

cost:
  budget: # 0 limits = unlimited
    maxRequests: 0
    maxTotalTokens: 0
    maxCostUsd: 10
  onExceeded: stop

# full | truncation-first | chunked | staged.
# chunked splits only when needed; full has no fallback rung.
context:
  strategy: full
  tokenEstimator:
    type: heuristic
    charsPerToken: 3.2 # lower for Cyrillic/CJK
  reserveOutputTokens: 2048
  safetyMarginRatio: 0.9
  truncation: # unused with strategy=full
    headTokens: 3000
    tailTokens: 0
  chunking:
    maxTokens: 5000
    overlapTokens: 150
    splitOn: heading

# Prompt template hashes affect task fingerprints; edits invalidate completed state.
prompts:
  dir: prompts
  templates:
    extract:
      system: extraction/system.md
      user: extraction/user.md
    websearch:
      system: websearch/system.md
      user: websearch/user.md
    translate: # for mode=document
      system: translation/system.md
      user: translation/user.md
    translateSegments: # for mode=segments
      system: translation/segments-system.md
      user: translation/segments-user.md
    localize:
      system: localization/system.md
      user: localization/user.md
  variables:
    projectName: Guitar codex

run:
  # Matches total endpoint capacity: local 1 + omniroute 3 + openrouter 4.
  concurrency: 8
  stateDir: .biomd/runs
  memoryDir: .biomd/memory # persistent translation memory only
  resume: auto # auto | off | <runId>
  dryRun: false
  failFast: false
  skipExistingOutputs: true # --no-skip-existing overrides

logging:
  level: info
  console: pretty # pretty | json | off
  file: .biomd/logs/biomd.jsonl
  # Human-readable live progress log; null disables, `!` marks incidents.
  # --dry-run never writes it.
  progressFile: progress.log
  # Flush interval for progress output.
  progressIntervalMs: 30000
