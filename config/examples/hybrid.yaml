# Local gateway *and* OpenRouter in one run.
#
# The pattern this exists to show: put the free local model first in every pool
# and the paid ones behind it. Combined with fallback, the corpus is processed
# locally and only the documents the local model fails on — a malformed answer,
# a missing required field, an overflowing context — reach a paid model. On a
# typical corpus that is a small minority of the work.
#
#   biomd run -c config/examples/hybrid.yaml --dry-run

version: 1

project:
  # Paths resolve against the repo root, not against this file's directory.
  rootDir: ../..

input:
  baseDir: examples
  include: ['*/**.bio.md']

catalogue:
  supportedLanguages: [en, es, ja, de, fr, it, pt, ru, zh, ko]
  defaultType: guitarist
  defaultPageType: hidden

tasks:
  extract:
    enabled: true
    pool: extract
    requiredFields: [forename, surname]
  translate:
    enabled: true
    pool: translate
    targetLanguages: [en, de]
    mode: segments
  localize:
    enabled: true
    pool: translate
  catalog:
    enabled: true

llm:
  endpoints:
    - id: local
      baseUrl: ${LOCAL_LLM_BASE_URL:-http://localhost:4000/v1}
      apiKey: ${LOCAL_LLM_API_KEY:-sk-local}
      maxConcurrent: 4
      # A local box that is down should not stall the run: fail fast and fall back.
      timeoutMs: 60000

    - id: openrouter
      baseUrl: https://openrouter.ai/api/v1
      apiKey: ${OPENROUTER_API_KEY}
      headers:
        HTTP-Referer: ${OPENROUTER_SITE_URL:-https://example.org}
        X-Title: ${OPENROUTER_APP_NAME:-biomd-process}
      requestsPerMinute: 120

  models:
    - id: local-small
      endpoint: local
      model: ${LOCAL_LLM_MODEL:-openai/gpt-oss-20b}
      contextWindow: 131072
      maxOutputTokens: 8192
      capabilities: [json_object, prompt_cache]
      pricing: { inputPer1M: 0, outputPer1M: 0 }
      tags: [local]

    - id: or-cheap
      endpoint: openrouter
      model: openai/gpt-4o-mini
      contextWindow: 128000
      maxOutputTokens: 16384
      capabilities: [json_schema, json_object, tools, prompt_cache]
      pricing: { inputPer1M: 0.15, outputPer1M: 0.6, cachedInputPer1M: 0.075 }
      # Reasoning tokens bill at the output rate and can outweigh the answer.
      # `dialect` names the wire format; `enabled: false` is an instruction to
      # the provider, not merely silence — omit the block to leave the model's
      # own default alone.
      reasoning: { enabled: false, dialect: reasoning }
      tags: [remote, cheap]

    - id: or-quality
      endpoint: openrouter
      model: anthropic/claude-sonnet-4.5
      contextWindow: 200000
      maxOutputTokens: 16384
      capabilities: [json_schema, tools, reasoning, prompt_cache]
      pricing: { inputPer1M: 3, outputPer1M: 15, cachedInputPer1M: 0.3 }
      reasoning: { enabled: false, dialect: reasoning }
      params: { temperature: 0.1 }
      tags: [remote, quality]

  routing:
    # Free is cheapest, so cost-optimized picks local first without being told.
    # Use `sequential` instead if you want the declared order regardless of price.
    strategy: cost-optimized
    pools:
      default: [local-small, or-cheap, or-quality]
      # Extraction is mechanical: local is usually enough.
      extract: [local-small, or-cheap, or-quality]
      # Translation is quality-sensitive: try local, escalate readily.
      translate: [local-small, or-quality, or-cheap]

reliability:
  retry: { maxAttempts: 2, initialDelayMs: 500, jitter: full }
  fallback: { maxTargets: 3, onValidationFailure: true }
  # A local box that dies should be taken out of rotation quickly rather than
  # retried once per document.
  circuitBreaker: { enabled: true, failureThreshold: 3, resetAfterMs: 60000 }

cost:
  budget:
    maxCostUsd: 2 # only paid calls count toward this
  onExceeded: stop

run:
  concurrency: 4
